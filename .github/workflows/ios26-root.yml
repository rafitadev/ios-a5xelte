name: ios26-root

# The iOS 26.6.2 root volume for herolte/gracelte: the iPhone 11's (iPhone12,1 / N104AP, 23G90) userland, merged and
# rewritten by Bergamota's Renegade (github.com/ry-diffusion/Bergamota, tools/renegade, pinned below) for a
# CPU without pointer authentication, plus tools/ios18/v80strip*.py for the S7's ARMv8.0 cores (LSE
# atomics, RCpc), then tools/herolte-tune-ios-root.sh. Published like ios-root.yml: a raw HFS+ image,
# gzip, split, as assets of a release in THIS repository. The image contains Apple software: the job
# refuses to run in a public repository, and the release must stay private to its owner.
on:
  push:
    branches: [ios26-root-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  root:
    if: github.event.repository.private == true
    runs-on: macos-15-intel
    timeout-minutes: 355            # GitHub-hosted jobs stop at 360; the macho stage alone took hours
    env:
      GH_TOKEN: ${{ github.token }}
      RENEGADE_TARGET: ios26
      BERGAMOTA_SHA: 37a7a7a917fc09945ed2f7d1ae68b84d4525b4cb
      BUILD: 23G90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Xcode and simulators are not needed; codesign is part of macOS)
        run: |
          df -h /
          # no Spotlight on the image: it indexes the 196k files we rewrite and kept the volume busy at detach
          sudo mdutil -a -i off || true
          sudo rm -rf /Applications/Xcode*.app /Library/Developer/CoreSimulator ~/Library/Developer/CoreSimulator \
            /Users/runner/Library/Android /usr/local/share/dotnet /usr/local/lib/android || true
          df -h /

      - name: Renegade and tools
        run: |
          set -euo pipefail
          git init -q berg
          git -C berg fetch -q --depth 1 https://github.com/ry-diffusion/Bergamota "$BERGAMOTA_SHA"
          git -C berg checkout -q FETCH_HEAD
          # newer Homebrew refuses formulae of untrusted taps
          brew tap blacktop/tap
          brew trust blacktop/tap || true
          brew install blacktop/tap/ipsw zstd pigz >/dev/null
          ipsw version
          python3 -m venv "$RUNNER_TEMP/venv"
          # capstone >= 5: v80strip leaves constant tables in __text alone (4.x cannot decode LSE/PAC)
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet numpy 'capstone==5.0.6'
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Donor device tree (DeviceTree.n104ap, for the ADT /product node)
        run: |
          set -euo pipefail
          url=$(ipsw download ipsw --device iPhone12,1 --version 26.6.2 --urls | tail -1)
          mkdir -p dt
          python3 tools/remotezip.py "$url" BuildManifest.plist dt
          path=$(python3 - dt/BuildManifest.plist <<'PY'
          import plistlib, sys
          m = plistlib.load(open(sys.argv[1], 'rb'))
          ident = next(i for i in m['BuildIdentities']
                       if i['Info']['DeviceClass'].lower() == 'n104ap' and 'Erase' in i['Info'].get('Variant', ''))
          print(ident['Manifest']['DeviceTree']['Info']['Path'])
          PY
          )
          python3 tools/remotezip.py "$url" "$path" dt
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet pyimg4
          "$RUNNER_TEMP/venv/bin/pyimg4" im4p extract -i "dt/$path" -o n104ap.adt
          ls -l n104ap.adt

      - name: Fetch and decrypt the root, SystemOS and AppOS images (~8.3 GB)
        working-directory: berg
        run: |
          set -euo pipefail
          bash tools/renegade/fetch-root.sh
          df -h /

      - name: Copy, PAC + v80 rewrite of every Mach-O and of the shared cache, Renegade's tweaks
        working-directory: berg
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/ios18/mkroot-s7.py" --renegade . --size 20g \
            --stages copy,macho,cache,tweaks --delete-sources --no-jb --no-bglrender --no-bluetooth
          df -h /

      - name: S7 tweaks (tools/herolte-tune-ios-root.sh)
        run: |
          set -euo pipefail
          root="$PWD/berg/research/ios26/full/root"
          mount | grep -F "$root"
          sudo bash tools/herolte-tune-ios-root.sh "$root" "$BUILD"

      - name: Unmount the root (retries, then -force)
        run: |
          set -uo pipefail
          # mkroot-full.py's seal detaches once, without retry: run 43773910122 lost 4 h of work to
          # "hdiutil: detach: timeout for DiskArbitration expired". Seal skips the detach when it is unmounted.
          root="$PWD/berg/research/ios26/full/root"
          sync
          for i in 1 2 3 4 5 6; do
            mount | grep -qF " $root " || break
            hdiutil detach "$root" && break
            sleep $((10 * i))
          done
          if mount | grep -qF " $root "; then
            hdiutil detach -force "$root"
          fi
          if mount | grep -qF " $root "; then
            echo "still mounted"; exit 1
          fi
          hdiutil info | tail -n 20

      - name: Seal and verify
        working-directory: berg
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/ios18/mkroot-s7.py" --renegade . --stages seal,verify
          ls -l research/ios26/

      - name: Raw image, compressed and split
        run: |
          set -euo pipefail
          img=berg/research/ios26/ios26-root-full.img
          pigz -1 -c "$img" > root26.img.gz
          rm -f "$img"
          split -b 1900m -d -a 2 root26.img.gz root26.img.gz.part
          rm root26.img.gz
          shasum -a 256 root26.img.gz.part* | tee SHA256SUMS

      - name: Publish as a private release
        run: |
          set -euo pipefail
          tag="ios26-root-26.6.2-${{ github.run_id }}"
          shasum -a 256 n104ap.adt >> SHA256SUMS
          gh release create "$tag" root26.img.gz.part* n104ap.adt SHA256SUMS \
            --title "iOS 26.6.2 (23G90) root for herolte/gracelte (Renegade + v80strip, 20 GiB)" \
            --notes "Apple software for personal use on the owner's device. Do not make this repository or release public."
